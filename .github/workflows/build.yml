name: Build DashUI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore dependencies
        run: dotnet restore DashUI.csproj

      - name: Build Release
        run: dotnet build DashUI.csproj -c Release --no-restore

      - name: Upload DashUI.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashUI
          path: bin/Release/net6.0/DashUI.dll
          if-no-files-found: error
