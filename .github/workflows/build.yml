name: Build DashUI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download BepInEx IL2CPP for interop DLLs
        run: |
          mkdir -p bepinex_tmp
          curl -sSL "https://github.com/BepInEx/BepInEx/releases/download/v6.0.0-be.733/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.733.zip" -o bepinex_tmp/bepinex.zip
          unzip -q bepinex_tmp/bepinex.zip -d bepinex_tmp/extracted

      - name: Build DashUI.dll
        run: dotnet build DashUI.csproj -c Release

      - name: Upload DashUI.dll
        uses: actions/upload-artifact@v4
        with:
          name: DashUI-dll
          path: bin/Release/net6.0/DashUI.dll
