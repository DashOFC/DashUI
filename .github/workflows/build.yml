name: Build DashUI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore NuGet packages
        run: dotnet restore DashUI.csproj

      - name: Check GameLibs files
        run: find "$HOME/.nuget/packages/amongus.gamelibs.steam" -maxdepth 5 2>/dev/null || true

      - name: Build DashUI.dll
        run: dotnet build DashUI.csproj -c Release --no-restore

      - name: Upload DashUI.dll
        uses: actions/upload-artifact@v4
        with:
          name: DashUI-dll
          path: bin/Release/net6.0/DashUI.dll
          
